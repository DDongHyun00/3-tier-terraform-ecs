# PR 검증 (#31). app/** 이 바뀌면 테스트, terraform/** 이 바뀌면 fmt·validate·plan을 돌리고 plan을 PR 코멘트로 남긴다.
# 자격 증명은 OIDC로 3tier-github-deploy 역할을 수임한다. 액세스 키 없음.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # plan 코멘트
  id-token: write      # OIDC 토큰 발급

# 같은 PR에 push가 연달아 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci.yml'

  app-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest # Docker가 있어서 Testcontainers(PostgreSQL)가 돈다
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/test

  terraform-plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/main
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_account_suffix: ${{ vars.TF_VAR_ACCOUNT_SUFFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      # 계정 ID는 Secret으로 두어야 단계 머리 env 출력까지 가려진다(#59). vars나 env로 넘기면 마스크보다 먼저 로그에 찍힌다
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/3tier-github-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - name: fmt
        run: terraform fmt -check -recursive ..
      - name: init
        run: terraform init -input=false
      - name: validate
        run: terraform validate -no-color
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false 2>&1 | tee plan.txt
      - name: comment plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/main/plan.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(plan 출력 없음)';
            const max = 60000;
            if (plan.length > max) plan = '…(앞부분 생략)\n' + plan.slice(-max);
            // 코멘트에는 add-mask가 닿지 않으므로 계정 ID 12자리를 직접 치환한다(#59)
            plan = plan.replace(/\b\d{12}\b/g, '************');
            const ok = '${{ steps.plan.outcome }}' === 'success';
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || [ok ? '' : 'plan 실패'])[0];
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### terraform plan ${ok ? '✅' : '❌'} ${summary}\n\n<details><summary>전체 출력</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
