# 앱 배포 (#32 → #102 승인 배포). main에 app/** 변경이 머지되면
#   1) build: 이미지를 한 번만 빌드해 ECR에 올린다(태그 = 커밋 SHA 앞 7자리)
#   2) staging: 같은 이미지를 스테이징에 롤링 배포하고 스모크 테스트(health 200, /posts 200)
#   3) production: GitHub Environment "production"의 필수 승인을 기다린 뒤, 같은 이미지를 운영에 롤링 배포
# 다시 빌드하지 않으므로 스테이징에서 검증한 바이너리가 그대로 운영에 간다(DEC-61).
# 스테이징이 꺼져 있으면(평소, DEC-42) staging 단계는 배포·검증 없이 건너뛰고 요약에 남긴다. 승인 단계는 항상 거친다.
# 자격 증명은 OIDC. build는 운영 역할(ref:main), staging은 스테이징 역할(environment:staging),
# production은 운영 역할(environment:production)을 수임한다. 액세스 키 없음.
# 태스크 정의는 각 환경의 최신 리비전을 내려받아 이미지만 바꿔 새 리비전으로 등록한다.
# Terraform은 서비스의 task_definition 변경을 무시하므로(ignore_changes) 이 배포를 되돌리지 않는다.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch: # 수동 실행(재배포, 측정, 워크플로 수정 후 확인)

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급

# 배포는 한 번에 하나만. 겹치면 뒤의 것이 기다린다(승인 대기 중인 실행도 포함)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: 3tier/board
  CONTAINER_NAME: board

jobs:
  build:
    runs-on: ubuntu-latest
    # 잡 출력에는 태그만 넘긴다. 계정 ID가 든 이미지 주소는 mask-aws-account-id 때문에 비밀로 보고
    # "Skip output 'image' since it may contain secret"으로 빠진다(첫 실행에서 실패해 확인).
    # 받는 잡이 자기 자격 증명의 계정으로 주소를 다시 조립한다. 태그가 같으니 같은 이미지다
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      t_built: ${{ steps.done.outputs.t }}
    steps:
      - uses: actions/checkout@v4

      - name: start timer
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # 계정 ID는 Secret으로 두어야 단계 머리 env 출력까지 가려진다(#59)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/3tier-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: image tag = commit SHA 앞 7자리
        id: tag
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::7}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # provenance=false: 증명 매니페스트 없이 이미지 하나만 올린다. 캐시는 GitHub Actions 캐시(mode=min, #36)
      # 빌드 요약·빌드 기록 아티팩트를 끈다. 둘 다 이미지 주소(계정 ID 포함)를 담고, 공개 레포에서는 누구나 본다.
      # 로그 마스킹은 요약·아티팩트에 닿지 않는다
      - name: build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: push done
        id: done
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "## build ${GITHUB_SHA::7}: $(( $(date +%s) - T0 ))초" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      ECS_CLUSTER: 3tier-staging-cluster
      ECS_SERVICE: 3tier-staging-board
      TASK_FAMILY: 3tier-staging-board
      SITE: https://staging.3tier.link
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/3tier-github-deploy-staging
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # 스테이징은 필요한 세션에만 켠다(DEC-42). 서비스가 없으면 이 단계는 건너뛰었다고 남기고 성공으로 끝낸다
      - name: is staging up?
        id: up
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ACTIVE" ]; then echo "up=true" >> "$GITHUB_OUTPUT"; else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "## staging: 꺼져 있음(서비스 ${STATUS}) → 배포·스모크 테스트 건너뜀" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: download current task definition
        if: steps.up.outputs.up == 'true'
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ needs.build.outputs.tag }}" >> "$GITHUB_ENV"
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: render new task definition
        if: steps.up.outputs.up == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: deploy to staging
        if: steps.up.outputs.up == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      # 스모크 테스트: liveness(앱 기동)와 /posts(DB까지 왕복). 롤링 직후 ALB 등록이 늦을 수 있어 몇 번 재시도한다
      - name: smoke test
        if: steps.up.outputs.up == 'true'
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE$1")
              [ "$code" = "200" ] && { echo "$1 200"; return 0; }
              echo "$1 $code (retry $i)"; sleep 6
            done
            return 1
          }
          check /actuator/health/liveness
          check /posts
          echo "## staging: 배포·스모크 통과 $(( $(date +%s) - T0 ))초" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    # 필수 승인자는 GitHub Environment 설정에서 지정한다. 승인 전에는 이 잡이 시작되지 않는다
    environment: production
    env:
      ECS_CLUSTER: 3tier-prod-cluster
      ECS_SERVICE: 3tier-prod-board
      TASK_FAMILY: 3tier-prod-board
    steps:
      - name: start timer
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/3tier-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # 현재 서비스가 쓰는 태스크 정의(최신 리비전)를 내려받는다. CPU·메모리·환경 변수는 그대로, 이미지만 바뀐다
      - name: download current task definition
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ needs.build.outputs.tag }}" >> "$GITHUB_ENV"
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      # 새 리비전 등록 → 서비스 갱신 → 롤링(100/200) 완료까지 대기. 서킷 브레이커가 롤백하면 여기서 실패한다
      # 폴링 간격 상한 15초(#36: 상한이 없으면 SDK 기본 600초까지 늘어 롤백을 8분 33초 늦게 알았다)
      - name: deploy to production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      - name: summary (#36 측정)
        if: always()
        run: |
          T2=$(date +%s)
          {
            echo "## production ${GITHUB_SHA::7}"
            echo "| 구간 | 초 |"
            echo "|---|---|"
            echo "| 빌드 끝 → 운영 롤링 끝(승인 대기 포함) | $((T2 - ${{ needs.build.outputs.t_built }})) |"
            echo "| 운영 롤링(안정화까지) | $((T2 - T0)) |"
          } >> "$GITHUB_STEP_SUMMARY"
