spring.application.name=board

# 스키마는 Flyway(db/migration)가 관리한다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# DB 접속 정보는 환경 변수로 주입한다 (운영: Secrets Manager -> ECS 태스크 환경 변수).
# 기본값은 로컬 Docker PostgreSQL(board-db) 기준이다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board}

# ALB 헬스체크용. health만 노출하고 상세 정보(DB 상태 등)는 숨긴다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# 세션은 Spring Session JDBC로 DB(SPRING_SESSION 테이블)에 저장한다. 테이블은 Flyway V3가 만든다.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.shutdown=immediate
spring.mvc.async.request-timeout=1800000