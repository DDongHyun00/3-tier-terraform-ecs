spring.application.name=board

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# DB 접속 정보는 환경 변수로 주입한다 (운영: Secrets Manager -> ECS 태스크 환경 변수).
# 기본값은 로컬 Docker PostgreSQL(board-db) 기준이다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board}

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data.sql 인코딩을 고정한다 (미지정 시 JVM 기본 인코딩을 따라 Windows에서 한글이 깨진다)
spring.sql.init.encoding=UTF-8

server.servlet.session.timeout=30m

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.shutdown=immediate
spring.mvc.async.request-timeout=1800000