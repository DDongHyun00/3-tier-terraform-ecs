spring.application.name=board

# 스키마는 Flyway(db/migration)가 관리한다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate

# DB 접속 정보는 환경 변수로 주입한다 (운영: Secrets Manager -> ECS 태스크 환경 변수).
# 기본값은 로컬 Docker PostgreSQL(board-db) 기준이다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board}

# ALB 헬스체크용. health만 노출하고 상세 정보(DB 상태 등)는 숨긴다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# 세션은 Spring Session JDBC로 DB(SPRING_SESSION 테이블)에 저장한다. 테이블은 Flyway V3가 만든다.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# 첨부파일 저장소: local(디스크) | s3. 운영은 STORAGE_TYPE=s3, ASSETS_BUCKET=<버킷>. 자격 증명은 ECS 태스크 역할.
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.dir=${UPLOAD_DIR:uploads}
app.storage.s3.bucket=${ASSETS_BUCKET:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 롤링 배포 중 처리 중인 요청을 끊지 않도록 유예 종료. ECS stopTimeout(기본 30초)보다 짧게 둔다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.mvc.async.request-timeout=1800000