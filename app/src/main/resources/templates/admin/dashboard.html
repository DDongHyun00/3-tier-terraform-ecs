<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>관리자 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
  </head>
  <body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="board-container">
      <header class="board-header">
        <h2 class="board-title">
          <i class="fas fa-chart-bar"></i> 관리자 대시보드
        </h2>
        <p class="board-subtitle">서비스 지표를 한 눈에 확인하세요.</p>
      </header>

      <div class="dashboard-grid">
        <div class="stat-card">
          전체 게시글: <span th:text="${stats.totalPosts}"></span>
        </div>
        <div class="stat-card">
          오늘 게시글: <span th:text="${stats.todayPosts}"></span>
        </div>
        <div class="stat-card">
          전체 댓글: <span th:text="${stats.totalComments}"></span>
        </div>
        <div class="stat-card">
          오늘 댓글: <span th:text="${stats.todayComments}"></span>
        </div>
        <div class="stat-card">
          전체 좋아요: <span th:text="${stats.totalLikes}"></span>
        </div>
        <div class="stat-card">
          오늘 좋아요: <span th:text="${stats.todayLikes}"></span>
        </div>
      </div>

      <div class="chart-card">
        <canvas id="statsChart"></canvas>
      </div>
    </div>

    <script th:inline="javascript">
      const stats = {
          totalPosts: [[${stats.totalPosts}]],
          todayPosts: [[${stats.todayPosts}]],
          totalComments: [[${stats.totalComments}]],
          todayComments: [[${stats.todayComments}]],
          totalLikes: [[${stats.totalLikes}]],
          todayLikes: [[${stats.todayLikes}]]
      };

      const ctx = document.getElementById('statsChart');
      new Chart(ctx, {
          type: 'bar',
          data: {
              labels: ['총 게시글', '오늘 게시글', '총 댓글', '오늘 댓글', '총 좋아요', '오늘 좋아요'],
              datasets: [{
                  label: '통계',
                  data: [
                      stats.totalPosts,
                      stats.todayPosts,
                      stats.totalComments,
                      stats.todayComments,
                      stats.totalLikes,
                      stats.todayLikes
                  ],
                  backgroundColor: 'rgba(54, 162, 235, 0.7)'
              }]
          }
      });
    </script>
  </body>
</html>
