<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 작성/수정</title>
  <link rel="stylesheet" th:href="@{/css/board.css}" />
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet"
  />
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="board-container">
  <header class="board-header">
    <h2 class="board-title">
      <i class="fas fa-edit"></i>
      <span
              th:text="${postId != null} ? '게시글 수정' : '새 글 작성'"
      ></span>
    </h2>
    <p
            class="board-subtitle"
            th:text="${postId != null} ? '게시글을 수정해주세요' : '새로운 글을 작성해주세요'"
    ></p>
  </header>

  <!-- 수정 폼 -->
  <div class="form-container">
    <form
            th:if="${postId != null}"
            th:action="@{/posts/{id}/edit(id=${postId})}"
            th:object="${postRequestDto}"
            method="post"
            class="post-form"
            enctype="multipart/form-data"> <!-- 🔑 파일 업로드 가능하도록 추가 -->
      <div class="form-group">
        <label for="title" class="form-label">
          <i class="fas fa-heading"></i> 제목
        </label>
        <input
                type="text"
                id="title"
                th:field="*{title}"
                class="form-input"
                placeholder="제목을 입력해주세요"
        />
        <div
                class="error-message"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}"
        ></div>
      </div>
      <div class="form-group">
        <label for="content" class="form-label">
          <i class="fas fa-align-left"></i> 내용
        </label>
        <textarea
                id="content"
                rows="15"
                th:field="*{content}"
                class="form-textarea"
                placeholder="내용을 입력해주세요"
        ></textarea>
        <div
                class="error-message"
                th:if="${#fields.hasErrors('content')}"
                th:errors="*{content}"
        ></div>
      </div>

      <!-- 🔽 파일 첨부 input 추가 -->
      <div class="form-group">
        <label for="files" class="form-label">
          <i class="fas fa-paperclip"></i> 파일 첨부
        </label>
        <input type="file" id="files" name="files" class="form-input" multiple />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">
          <i class="fas fa-save"></i> 수정하기
        </button>
        <a th:href="@{/posts}" class="btn-cancel">
          <i class="fas fa-times"></i> 취소
        </a>
      </div>
    </form>

    <!-- 작성 폼 -->
    <form
            th:unless="${postId != null}"
            th:action="@{/posts}"
            th:object="${postRequestDto}"
            method="post"
            class="post-form"
            enctype="multipart/form-data"> <!-- 🔑 파일 업로드 가능하도록 추가 -->
      <div class="form-group">
        <label for="title" class="form-label">
          <i class="fas fa-heading"></i> 제목
        </label>
        <input
                type="text"
                id="title"
                th:field="*{title}"
                class="form-input"
                placeholder="제목을 입력해주세요"
        />
        <div
                class="error-message"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}"
        ></div>
      </div>
      <div class="form-group">
        <label for="content" class="form-label">
          <i class="fas fa-align-left"></i> 내용
        </label>
        <textarea
                id="content"
                rows="15"
                th:field="*{content}"
                class="form-textarea"
                placeholder="내용을 입력해주세요"
        ></textarea>
        <div
                class="error-message"
                th:if="${#fields.hasErrors('content')}"
                th:errors="*{content}"
        ></div>
      </div>

      <!-- 🔽 파일 첨부 input 추가 -->
      <div class="form-group">
        <label for="files" class="form-label">
          <i class="fas fa-paperclip"></i> 파일 첨부
        </label>
        <input type="file" id="files" name="files" class="form-input" multiple />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">
          <i class="fas fa-paper-plane"></i> 작성하기
        </button>
        <a th:href="@{/posts}" class="btn-cancel">
          <i class="fas fa-times"></i> 취소
        </a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
