<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - 서버 오류</title>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="board-container">
      <div class="error-container">
        <div class="error-icon">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="error-code">500</h1>
        <h2 class="error-title">서버 오류</h2>
        <p class="error-message">
          요청 처리 중 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
        </p>
        <div class="error-actions">
          <a th:href="@{/}" class="btn-back">
            <i class="fas fa-home"></i> 메인으로 돌아가기
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
