<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - 게시판</title>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="board-container">
      <header class="board-header">
        <h2 class="board-title"><i class="fas fa-sign-in-alt"></i> 로그인</h2>
        <p class="board-subtitle">게시판에 오신 것을 환영합니다!</p>
      </header>

      <div class="form-container">
        <!-- 로그인 처리 URL은 SecurityConfig에서 지정한 /process-login -->
        <form th:action="@{/process-login}" method="post" class="auth-form">
          <div class="form-group">
            <label for="username" class="form-label">
              <i class="fas fa-user"></i> 아이디
            </label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="아이디를 입력해주세요"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">
              <i class="fas fa-lock"></i> 비밀번호
            </label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="비밀번호를 입력해주세요"
              required
            />
          </div>

          <!-- CSRF 토큰 (Thymeleaf 자동 제공) -->
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <div class="form-actions">
            <a href="javascript:history.back()" class="btn-back">
              <i class="fas fa-arrow-left"></i> 뒤로가기
            </a>
            <button type="submit" class="btn-submit">
              <i class="fas fa-sign-in-alt"></i> 로그인
            </button>
          </div>
        </form>

        <!-- 메시지 처리 -->
        <div th:if="${param.error}" class="alert alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          아이디 또는 비밀번호가 잘못되었습니다.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
          <i class="fas fa-check-circle"></i>
          로그아웃 되었습니다.
        </div>

        <!-- 회원가입 링크 -->
        <div class="auth-links">
          <p>아직 계정이 없으신가요?</p>
          <a th:href="@{/signup}" class="btn-signup">
            <i class="fas fa-user-plus"></i> 회원가입
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
