<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 게시판</title>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="board-container">
      <header class="board-header">
        <h2 class="board-title"><i class="fas fa-user-plus"></i> 회원가입</h2>
        <p class="board-subtitle">회원가입하고 게시판을 이용해 보세요!</p>
      </header>

      <div class="form-container">
        <form th:action="@{/signup}" method="post" class="auth-form">
          <div class="form-group">
            <label for="username" class="form-label">
              <i class="fas fa-user"></i> 아이디
            </label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="아이디를 입력해주세요"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">
              <i class="fas fa-lock"></i> 비밀번호
            </label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="비밀번호를 입력해주세요"
              required
            />
          </div>

          <div class="form-group">
            <label for="nickname" class="form-label">
              <i class="fas fa-id-card"></i> 닉네임
            </label>
            <input
              type="text"
              id="nickname"
              name="nickname"
              class="form-input"
              placeholder="닉네임을 입력해주세요"
              required
            />
          </div>

          <!-- CSRF 토큰 -->
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <div class="form-actions">
            <button type="submit" class="btn-submit">
              <i class="fas fa-user-plus"></i> 회원가입
            </button>
          </div>
        </form>

        <!-- 에러 메시지 표시 -->
        <div th:if="${error}" class="alert alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          <span th:text="${error}"></span>
        </div>

        <!-- 로그인 링크 -->
        <div class="auth-links">
          <p>이미 계정이 있으신가요?</p>
          <a th:href="@{/login}" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> 로그인
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
